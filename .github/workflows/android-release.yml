name: Build Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-release:
    name: Build Signed Release APK and AAB
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Decode Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          printf "%s" "$KEYSTORE_BASE64" | base64 --decode > ${{ runner.temp }}/aura-play-release.jks

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Release APK and AAB
        env:
          KEYSTORE_PATH: ${{ runner.temp }}/aura-play-release.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew assembleRelease bundleRelease --stacktrace

      - name: Verify APK Signature
        env:
          ANDROID_HOME: ${{ env.ANDROID_HOME }}
        run: |
          # Find apksigner
          APKSIGNER=$(find $ANDROID_HOME/build-tools -name "apksigner" | sort -r | head -n 1)
          if [ -n "$APKSIGNER" ]; then
            $APKSIGNER verify --print-certs app/build/outputs/apk/release/*.apk
          else
            echo "apksigner not found"
          fi

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: aura-play-release-apk
          path: app/build/outputs/apk/release/*.apk
          retention-days: 7

      - name: Upload Release AAB
        uses: actions/upload-artifact@v4
        with:
          name: aura-play-release-aab
          path: app/build/outputs/bundle/release/*.aab
          retention-days: 7
